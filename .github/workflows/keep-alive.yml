name: Keep API awake

# Render's free plan puts a service to sleep after 15 minutes without traffic, and the next
# visitor waits up to a minute for it to wake. Pinging /health just inside that window keeps
# it warm. Set the API's address once as a repository variable called BACKEND_URL
# (Settings -> Secrets and variables -> Actions -> Variables), e.g. https://codecollab-api.onrender.com
on:
  schedule:
    # Cron only takes whole minutes, so 14 is the closest to 14.5 that stays under 15.
    - cron: '*/14 * * * *'
  workflow_dispatch: # Lets you run it by hand from the Actions tab.

# A slow wake-up must not stack a second ping on top of the first.
concurrency: keep-alive

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL isn't set, so there's nothing to ping yet."
            exit 0
          fi
          # A sleeping instance can take up to a minute to answer, so wait and retry
          # before calling it down. A failure here emails you, which doubles as an outage alert.
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "${BACKEND_URL%/}/health"
