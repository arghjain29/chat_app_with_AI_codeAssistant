# Serves the built SPA. Mirrors what vercel.json does on Vercel.

# Hashed filenames can be cached forever; index.html must never be, or a deploy
# goes unnoticed. Set here rather than per location, because an `add_header` inside
# a location would drop the security headers inherited from the server block.
map $uri $cache_control {
  default          "no-cache";
  ~^/assets/       "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # WebContainer only runs on a cross-origin isolated page.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cache-Control $cache_control always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Client-side routing: every unknown path is handled by the app, not by nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
